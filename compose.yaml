# Environnement de développement local.
# Pour l'instant : PostgreSQL 16 seul (ADR-0002). L'API continue de tourner
# sur l'hôte via `npm run api` et s'y connecte par DATABASE_URL.
#
#   docker compose up -d      # démarre la base
#   docker compose down       # l'arrête (les données sont conservées)
#   docker compose down -v    # l'arrête ET supprime les données

name: pousse

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pousse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pousse}
      POSTGRES_DB: ${POSTGRES_DB:-pousse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
