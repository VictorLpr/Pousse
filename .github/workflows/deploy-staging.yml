name: Deploy staging

# Runs on every PR, but the `deploy` job waits for manual approval
# (required reviewer on the `staging` environment): we pick which PRs to
# deploy. There is a single staging, held by the last deployed PR.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Queued, never cancelled mid-migration.
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: rg.fr-par.scw.cloud
  IMAGE: rg.fr-par.scw.cloud/pousse/api

jobs:
  checks:
    # A PR from a fork has no access to secrets.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy (approval required)
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ steps.web.outputs.deployment-url }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --- API ------------------------------------------------------------
      - name: Image tag
        id: image
        run: echo "ref=${IMAGE}:staging-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push image
        run: |
          docker build --target runtime -f apps/api/Dockerfile -t "${{ steps.image.outputs.ref }}" .
          docker push "${{ steps.image.outputs.ref }}"

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if find apps/api/drizzle -name '*.sql' | grep -q .; then
            npm run db:migrate -w apps/api
          else
            echo "No migrations to apply."
          fi

      - uses: scaleway/action-scw@v0
        with:
          save-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      # The update redeploys the container. The liveness probe is set in the
      # console (TCP): /health queries the database, which is slow to wake up.
      - name: Update container
        env:
          CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          scw container container update "$CONTAINER_ID" region=fr-par \
            port=3000 \
            image="${{ steps.image.outputs.ref }}" \
            "secret-environment-variables.DATABASE_URL=$DATABASE_URL" > /dev/null

      # Keeps only the last two staging images: the one just deployed and the
      # previous one. vX.Y.Z tags (production, rollback) are never touched.
      # A failure doesn't cancel the deploy.
      - name: Prune old staging images
        continue-on-error: true
        env:
          CURRENT_TAG: ${{ steps.image.outputs.ref }}
        run: |
          image_id=$(scw registry image list name=api region=fr-par -o json | jq -r '.[0].id // empty')
          if [ -z "$image_id" ]; then
            echo "::warning::Image api not found in the registry, skipping cleanup."
            exit 0
          fi
          scw registry tag list image-id="$image_id" order-by=created_at_desc region=fr-par -o json \
            | jq -r --arg current "${CURRENT_TAG##*:}" '
                [.[] | select(.name | startswith("staging-")) | select(.name != $current)]
                | .[1:][] | "\(.id) \(.name)"' \
            | while read -r id name; do
                echo "Deleting $name"
                scw registry tag delete "$id" region=fr-par > /dev/null
              done

      # --- Web ------------------------------------------------------------
      - name: Export PWA
        working-directory: apps/mobile
        run: npx expo export -p web

      - name: Deploy Worker
        id: web
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.132.0'
          workingDirectory: apps/mobile
          command: deploy --env staging --var API_ORIGIN:${{ secrets.API_ORIGIN }}

      # --- Verification -----------------------------------------------------
      # Cold start (min-scale 0): retry for at least 60 s.
      - name: Smoke test
        env:
          WEB_URL: ${{ steps.web.outputs.deployment-url }}
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null "$WEB_URL"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$WEB_URL/api/health"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_URL: ${{ steps.web.outputs.deployment-url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body \
            "🌱 **Staging deployed**: $WEB_URL — commit \`${GITHUB_SHA::7}\` (image \`${{ steps.image.outputs.ref }}\`)"
