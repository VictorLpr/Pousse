name: Reset staging database

# Drizzle can't roll back a migration: a PR abandoned after deployment
# leaves its schema in staging. This workflow wipes the staging database,
# then replays main's migrations. It only has access to the `staging`
# environment, never to `production`.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "staging" to confirm the wipe
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reset:
    if: inputs.confirmation == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The IAM application doesn't own the `public` schema (Serverless SQL
      # keeps it), so it can't drop it: empty it object by object instead.
      - name: Drop schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA IF EXISTS drizzle CASCADE;
          DO $$
          DECLARE
            r record;
          BEGIN
            FOR r IN SELECT viewname FROM pg_views WHERE schemaname = 'public' LOOP
              EXECUTE format('DROP VIEW IF EXISTS public.%I CASCADE', r.viewname);
            END LOOP;
            FOR r IN SELECT matviewname FROM pg_matviews WHERE schemaname = 'public' LOOP
              EXECUTE format('DROP MATERIALIZED VIEW IF EXISTS public.%I CASCADE', r.matviewname);
            END LOOP;
            FOR r IN SELECT tablename FROM pg_tables WHERE schemaname = 'public' LOOP
              EXECUTE format('DROP TABLE IF EXISTS public.%I CASCADE', r.tablename);
            END LOOP;
            FOR r IN SELECT sequencename FROM pg_sequences WHERE schemaname = 'public' LOOP
              EXECUTE format('DROP SEQUENCE IF EXISTS public.%I CASCADE', r.sequencename);
            END LOOP;
            FOR r IN
              SELECT p.oid::regprocedure AS signature
              FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'public'
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = p.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP ROUTINE IF EXISTS %s CASCADE', r.signature);
            END LOOP;
            FOR r IN
              SELECT t.typname
              FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
              WHERE n.nspname = 'public' AND t.typtype IN ('e', 'd')
                AND NOT EXISTS (SELECT 1 FROM pg_depend d WHERE d.objid = t.oid AND d.deptype = 'e')
            LOOP
              EXECUTE format('DROP TYPE IF EXISTS public.%I CASCADE', r.typname);
            END LOOP;
          END
          $$;
          SQL

      - name: Replay migrations from main
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if find apps/api/drizzle -name '*.sql' | grep -q .; then
            npm run db:migrate -w apps/api
          else
            echo "No migrations to apply."
          fi
