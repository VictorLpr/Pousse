name: Deploy production

# `git tag vX.Y.Z && git push origin vX.Y.Z` on a commit of main deploys
# production. Rollback: run this workflow manually with an earlier tag
# (the database itself is not rolled back).
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to redeploy (e.g. v0.1.0)
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: rg.fr-par.scw.cloud/pousse/api
  VERSION: ${{ inputs.tag || github.ref_name }}

jobs:
  checks:
    # A manual redeploy reuses a tag that was already checked when released.
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: checks
    if: ${{ !cancelled() && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.web.outputs.deployment-url }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
          fetch-depth: 0

      - name: Assert tag is on main
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::\"$VERSION\" is not a vX.Y.Z version tag."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The commit of tag $VERSION is not on main: deploy refused."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # --- API ------------------------------------------------------------
      - uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      # An already-built version (rollback) is not rebuilt.
      - name: Build and push image
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "Image $IMAGE:$VERSION already exists, reusing it."
          else
            docker build --target runtime -f apps/api/Dockerfile -t "$IMAGE:$VERSION" .
            docker push "$IMAGE:$VERSION"
          fi

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if find apps/api/drizzle -name '*.sql' | grep -q .; then
            npm run db:migrate -w apps/api
          else
            echo "No migrations to apply."
          fi

      - uses: scaleway/action-scw@v0
        with:
          save-config: true
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      - name: Update container
        env:
          CONTAINER_ID: ${{ secrets.SCW_CONTAINER_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          scw container container update "$CONTAINER_ID" region=fr-par \
            port=3000 \
            image="$IMAGE:$VERSION" \
            "secret-environment-variables.DATABASE_URL=$DATABASE_URL" > /dev/null

      # --- Web ------------------------------------------------------------
      - name: Export PWA
        working-directory: apps/mobile
        run: npx expo export -p web

      - name: Deploy Worker
        id: web
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.132.0'
          workingDirectory: apps/mobile
          command: deploy --env production --var API_ORIGIN:${{ secrets.API_ORIGIN }}

      # --- Verification -----------------------------------------------------
      - name: Smoke test
        env:
          WEB_URL: ${{ steps.web.outputs.deployment-url }}
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors -o /dev/null "$WEB_URL"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$WEB_URL/api/health"

      - name: Create release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --generate-notes
