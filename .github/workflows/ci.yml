name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Reused by the deploy workflows before shipping.
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call: a deploy therefore
  # doesn't cancel the same PR's CI, and vice versa.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Name required by the `main` ruleset: renaming it blocks every merge.
    name: Lint, format, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Integration tests: Testcontainers starts PostgreSQL on the runner's
      # Docker (ADR-0007).
      - name: Tests
        run: npm test
