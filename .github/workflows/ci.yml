name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Réutilisé par les workflows de déploiement avant de livrer.
  workflow_call:

concurrency:
  # github.workflow vaut le nom de l'appelant en workflow_call : un déploiement
  # n'annule donc pas la CI de la même PR, et inversement.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, format, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # - name: Tests
      #   run: npm test
